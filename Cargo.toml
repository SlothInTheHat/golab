[workspace]
resolver = "2"
members = [
    "crates/golab-core",
    "crates/golab-daemon",
    "crates/golab-mcp",
    "crates/golab-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
golab-core = { path = "crates/golab-core" }
golab-daemon = { path = "crates/golab-daemon" }
golab-mcp = { path = "crates/golab-mcp" }

anyhow = "1"
blake3 = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
clap = { version = "4", features = ["derive"] }
ignore = "0.4"
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "signal"] }
tree-sitter = "0.26"

axum = { version = "0.8", features = ["ws"] }
tower-http = { version = "0.6", features = ["cors"] }
